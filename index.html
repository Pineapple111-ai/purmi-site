<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>푸르미론 | 빠르고 간편한 대출 상담</title>
<meta name="description" content="전문 상담사가 고객님의 상황에 맞는 대출 상품을 안내해드립니다. 지금 무료 상담을 신청하세요.">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="푸르미론 | 빠르고 간편한 대출 상담">
<meta property="og:description" content="전문 상담사가 고객님의 상황에 맞는 대출 상품을 안내해드립니다.">
<meta property="og:locale" content="ko_KR">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { brand: '#2E6BFF', brandDark: '#1E4FD1', ink: '#26282B', sub: '#6B7280' },
        fontFamily: { sans: ['Pretendard', 'Noto Sans KR', 'sans-serif'] },
        boxShadow: { soft: '0 4px 20px rgba(20,30,60,0.08)', card: '0 2px 12px rgba(20,30,60,0.06)' }
      }
    }
  }
</script>

<style>
  html { scroll-behavior: smooth; }
  body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
  input:focus { outline: 2px solid #2E6BFF; outline-offset: 1px; }
  button:focus-visible, a:focus-visible { outline: 2px solid #2E6BFF; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body class="bg-white text-ink antialiased">

<!-- 1. 메인 히어로 -->
<header class="px-6 pt-8 pb-2 max-w-md mx-auto">
  <div class="flex items-center gap-2">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="28" height="28" rx="8" fill="#2E6BFF"/>
      <path d="M8 18L12.5 10L16 15L20 9" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="text-lg font-bold tracking-tight">푸르미론</span>
  </div>
</header>

<main class="max-w-md mx-auto px-6">

  <!-- Hero copy -->
  <section class="pt-6 pb-6 text-center">
    <h1 class="text-[28px] leading-[1.35] font-extrabold text-ink">
      신불자, 연체자 가능<br>작업대출 상담
    </h1>
    <p class="mt-3 text-[15px] text-sub leading-relaxed">
      전문 상담사가 고객님의 상황에 맞는<br>상품을 안내해드립니다.
    </p>
  </section>

  <!-- 2. 신청 폼 -->
  <section id="apply" class="pb-8">
    <form id="loan-form" novalidate class="bg-white border border-gray-100 rounded-2xl shadow-soft p-5">
      <div class="space-y-3.5">
        <div>
          <label for="name" class="block text-sm font-semibold text-ink mb-1.5">이름</label>
          <input type="text" id="name" name="name" placeholder="이름을 입력해주세요"
            class="w-full h-[52px] px-4 rounded-xl border border-gray-200 text-[15px] placeholder:text-gray-400 focus:border-brand transition-colors">
          <p id="name-error" class="hidden mt-1.5 text-xs text-red-500">이름을 입력해주세요.</p>
        </div>

        <div>
          <label for="phone" class="block text-sm font-semibold text-ink mb-1.5">연락처</label>
          <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" inputmode="numeric" maxlength="13"
            class="w-full h-[52px] px-4 rounded-xl border border-gray-200 text-[15px] placeholder:text-gray-400 focus:border-brand transition-colors">
          <p id="phone-error" class="hidden mt-1.5 text-xs text-red-500">연락처를 입력해주세요.</p>
        </div>

        <p class="text-[11px] text-gray-400 leading-snug pt-1">
          신청 시 개인정보 수집 및 이용에 동의하는 것으로 간주됩니다.
        </p>
      </div>

      <button type="submit"
        class="mt-5 w-full h-[56px] rounded-xl bg-brand text-white font-bold text-[16px] shadow-[0_6px_16px_rgba(46,107,255,0.35)] active:bg-brandDark active:scale-[0.99] transition-all">
        상담 신청하기
      </button>

      <p id="form-success" class="hidden mt-3 text-center text-sm font-medium text-brand">
        신청이 접수되었습니다. 빠르게 연락드리겠습니다.
      </p>
    </form>
  </section>

  <!-- 3. 서비스 특징 -->
  <section class="pb-10">
    <div class="grid grid-cols-3 gap-3">
      <div class="text-center">
        <div class="mx-auto mb-2 w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2E6BFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
        </div>
        <p class="text-[13px] font-semibold text-ink">간편 신청</p>
      </div>
      <div class="text-center">
        <div class="mx-auto mb-2 w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2E6BFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        </div>
        <p class="text-[13px] font-semibold text-ink">빠른 상담</p>
      </div>
      <div class="text-center">
        <div class="mx-auto mb-2 w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2E6BFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
        </div>
        <p class="text-[13px] font-semibold text-ink">맞춤 안내</p>
      </div>
    </div>
  </section>

  <!-- 4. 상담 절차 -->
  <section class="pb-10">
    <h2 class="text-[17px] font-bold text-ink mb-4 text-center">상담 절차</h2>
    <div class="flex items-center justify-between">
      <div class="flex-1 text-center">
        <div class="mx-auto mb-2 w-11 h-11 rounded-full bg-brand text-white flex items-center justify-center font-bold text-sm">1</div>
        <p class="text-[13px] font-medium text-ink">상담 신청</p>
      </div>
      <div class="w-6 h-px bg-gray-200 shrink-0"></div>
      <div class="flex-1 text-center">
        <div class="mx-auto mb-2 w-11 h-11 rounded-full bg-brand text-white flex items-center justify-center font-bold text-sm">2</div>
        <p class="text-[13px] font-medium text-ink">전문 상담</p>
      </div>
      <div class="w-6 h-px bg-gray-200 shrink-0"></div>
      <div class="flex-1 text-center">
        <div class="mx-auto mb-2 w-11 h-11 rounded-full bg-brand text-white flex items-center justify-center font-bold text-sm">3</div>
        <p class="text-[13px] font-medium text-ink">상품 안내</p>
      </div>
    </div>
  </section>

  <footer class="pb-8 text-center">
    <p class="text-[11px] text-gray-400">© 푸르미론. 본 상담은 무료로 제공됩니다.</p>
  </footer>

</main>

<script>
  const form = document.getElementById('loan-form');
  const nameInput = document.getElementById('name');
  const phoneInput = document.getElementById('phone');
  const nameError = document.getElementById('name-error');
  const phoneError = document.getElementById('phone-error');
  const successMsg = document.getElementById('form-success');

  const PHONE_RE = /^01[0-9]-\d{3,4}-\d{4}$/;

  function formatPhone(value) {
    const digits = value.replace(/\D/g, '').slice(0, 11);
    if (digits.length < 4) return digits;
    if (digits.length < 8) return digits.slice(0, 3) + '-' + digits.slice(3);
    if (digits.length < 11) return digits.slice(0, 3) + '-' + digits.slice(3, 6) + '-' + digits.slice(6);
    return digits.slice(0, 3) + '-' + digits.slice(3, 7) + '-' + digits.slice(7, 11);
  }

  phoneInput.addEventListener('input', function () {
    phoneInput.value = formatPhone(phoneInput.value);
    setFieldError(phoneInput, phoneError, false);
  });

  function setFieldError(input, errorEl, hasError) {
    errorEl.classList.toggle('hidden', !hasError);
    input.classList.toggle('border-red-400', hasError);
    input.classList.toggle('border-gray-200', !hasError);
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    successMsg.classList.add('hidden');

    const nameValid = nameInput.value.trim().length > 0;
    const phoneValid = PHONE_RE.test(phoneInput.value.trim());

    setFieldError(nameInput, nameError, !nameValid);
    setFieldError(phoneInput, phoneError, !phoneValid);

    if (!nameValid || !phoneValid) {
      if (!nameValid) nameInput.focus();
      else if (!phoneValid) phoneInput.focus();
      return;
    }

    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = '전송 중...';

    try {
      const params = new URLSearchParams(window.location.search);
      let source = params.get('utm_source');

      if (!source) {
        const ref = document.referrer || '';
        if (ref.includes('instagram.com')) source = 'instagram(referrer)';
        else if (ref.includes('facebook.com') || ref.includes('fb.com')) source = 'facebook(referrer)';
        else if (params.get('fbclid')) source = 'meta_unknown(fbclid만 감지)';
        else source = 'direct';
      }

      const campaign = params.get('utm_campaign') || '';
      const placement = params.get('placement') || '';

      const res = await fetch('/.netlify/functions/submit-consult', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: nameInput.value.trim(),
          phone: phoneInput.value.trim(),
          agree: true,
          source: source,
          campaign: campaign,
          placement: placement
        })
      });

      if (!res.ok) throw new Error('요청 실패');

      successMsg.classList.remove('hidden');
      form.reset();
    } catch (err) {
      alert('신청 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '상담 신청하기';
    }
  });

  nameInput.addEventListener('input', function () {
    setFieldError(nameInput, nameError, false);
  });
  agreeInput.addEventListener('change', function () {
    agreeError.classList.add('hidden');
  });
</script>

</body>
</html>
